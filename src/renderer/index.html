<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
  <title>PetusLauncher</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Title bar (frameless drag region + window controls + user chip) -->
  <div class="topbar">
    <div class="brand"><img src="icon.png" alt="" onerror="this.style.display='none'" /> PetusLauncher</div>
    <div class="topbar-right">
      <div id="userChip" class="user-chip" hidden>
        <span id="userName"></span>
        <span class="caret">▾</span>
        <div id="userMenu" class="user-menu" hidden>
          <a href="#" data-act="profile">Профиль</a>
          <a href="#" data-act="settings">Настройки</a>
          <a href="#" data-act="logout">Выйти</a>
        </div>
      </div>
    </div>
    <div class="win-ctrls">
      <button id="winMin" class="win-btn" title="Свернуть">─</button>
      <button id="winClose" class="win-btn close" title="Закрыть">✕</button>
    </div>
  </div>

  <div class="shell">
    <!-- Left sidebar: game list -->
    <aside class="sidebar">
      <div class="sidebar-title">Игры</div>
      <div id="gameList" class="game-list"></div>
    </aside>

    <!-- Main content: login OR selected game page -->
    <main class="content">
      <!-- Login gate -->
      <section id="loginView" class="login-view" hidden>
        <div class="login-card">
          <div class="login-logo">▲</div>
          <div class="login-title">Вход в Петус</div>
          <p class="muted">Войди через Petus ID, чтобы играть.<br />Регистрация и пароли не нужны.</p>
          <button id="loginBtn" class="btn btn-primary big">Войти через Petus ID</button>
        </div>
      </section>

      <!-- Game page (rendered dynamically) -->
      <section id="gameView" hidden></section>
    </main>
  </div>

  <!-- Generic in-window modal -->
  <div id="modalWrap" class="modal-wrap" hidden>
    <div class="modal">
      <div class="modal-head">
        <span id="modalTitle"></span>
        <button id="modalClose" class="modal-x">✕</button>
      </div>
      <div id="modalBody" class="modal-body"></div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
